<script id="patientFinalMobilePolishScript">
document.addEventListener("DOMContentLoaded", function () {
  const isMobile = () => window.matchMedia("(max-width: 768px)").matches;

  function normalizeStatus(text) {
    const value = String(text || "").trim().toLowerCase();
    if (value.includes("confirm")) return "confirmed";
    if (value.includes("complete")) return "completed";
    if (value.includes("pending")) return "pending";
    if (value.includes("cancel")) return "cancelled";
    if (value.includes("declin")) return "declined";
    if (value.includes("announce")) return "announcement";
    return "info";
  }

  if (isMobile()) {
    document.querySelectorAll(".status-badge, .badge-status, [data-status]").forEach(function (el) {
      const status = el.dataset.status || el.textContent;
      el.classList.add("mobile-status-chip", normalizeStatus(status));
    });
  }

  document.querySelectorAll("[data-empty-container]").forEach(function (container) {
    const selector = container.dataset.emptyItem || ".appointment-card, .notification-item, .record-item, tr";
    const items = Array.from(container.querySelectorAll(selector)).filter(function (item) {
      return !item.closest("thead") && item.style.display !== "none";
    });

    if (!items.length && !container.querySelector(".mobile-empty-state")) {
      const title = container.dataset.emptyTitle || "No records found";
      const message = container.dataset.emptyMessage || "There is nothing to display yet.";
      const actionHref = container.dataset.emptyHref || "";
      const actionText = container.dataset.emptyAction || "";

      const empty = document.createElement("div");
      empty.className = "mobile-empty-state";
      empty.innerHTML =
        '<i class="fas fa-calendar-check" aria-hidden="true"></i>' +
        '<h3>' + title + '</h3>' +
        '<p>' + message + '</p>' +
        (actionHref && actionText
          ? '<a class="btn btn-primary" href="' + actionHref + '">' + actionText + '</a>'
          : "");
      container.appendChild(empty);
    }
  });
});
</script>
