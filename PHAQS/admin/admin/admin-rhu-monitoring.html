<style id="hcLogoutConfirmationStyles">
.hc-logout-backdrop{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.48);backdrop-filter:blur(2px)}
.hc-logout-backdrop.show{display:flex}.hc-logout-dialog{width:min(430px,100%);overflow:hidden;border:1px solid #dbe3ef;border-radius:14px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.28);font-family:Inter,Arial,sans-serif}
.hc-logout-dialog-head{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}.hc-logout-dialog-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#fee2e2;color:#dc2626;font-size:17px}.hc-logout-dialog-head h3{margin:0;color:#0f172a;font-size:18px;font-weight:750}.hc-logout-dialog-body{padding:0 22px 20px;color:#64748b;font-size:14px;line-height:1.55}.hc-logout-dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid #e7edf5;background:#f8fafc}.hc-logout-dialog-actions button{min-width:94px;height:40px;border-radius:8px;font:700 13px Inter,Arial,sans-serif;cursor:pointer}.hc-logout-cancel{border:1px solid #cbd5e1;background:#fff;color:#334155}.hc-logout-confirm{border:1px solid #dc2626;background:#dc2626;color:#fff}.hc-logout-confirm:disabled{opacity:.65;cursor:wait}
</style>
</head><body><nav class="navbar"><div class="nav-container"><div class="logo-area"><img src="images/mhc-logo.png"><div><strong>Pulilan Health Center</strong><small>PHAQS · Admin Panel</small></div></div><div class="nav-right"><div class="admin-info"><span class="a-name" id="adminName">Administrator</span><span class="a-role" id="adminRole">Admin</span></div><div class="admin-avatar">A</div><button class="btn-logout" onclick="doLogout()" data-hc-logout><i class="fas fa-right-from-bracket"></i> Logout</button><button class="hamburger-btn" onclick="toggleAdminMenu()"><i class="fas fa-bars"></i></button></div><div class="mobile-sidebar" id="mobileSidebar"></div></div></nav><div class="layout"><aside class="sidebar"></aside><main class="main-content"><div class="page-header"><h2>RHU Monitoring</h2><p>Monitor today’s appointment and queue activity across RHU I–IV.</p></div><div class="notice-box" style="display:flex"><i class="fas fa-circle-info"></i><span>All figures below are loaded directly from the appointments database.</span></div><div class="hc-rhu-grid" id="rhuCards"><div class="hc-rhu-card">Loading RHU data...</div></div></main></div><script src="admin-api.js"></script><script>function toggleAdminMenu(){document.getElementById('mobileSidebar')?.classList.toggle('show')}async function doLogout(){if(!await hcConfirm('Are you sure you want to log out?',{title:'Confirm logout',confirmText:'Log out',danger:true}))return;try{await hcApi('admin_logout',{})}catch(e){}location.href='admin-login.html'}</script><script>
(async()=>{try{const r=await hcApi('admin_data'),branches=['RHU I - Poblacion','RHU II - Cutcot','RHU III - Tinejero','RHU IV - Tibag'];const now=new Date(),today=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);document.getElementById('rhuCards').innerHTML=branches.map(b=>{const a=r.appointments.filter(x=>x.center===b&&x.appointment_date===today),waiting=a.filter(x=>['Pending','Confirmed','Hold'].includes(x.status)).length,serving=a.filter(x=>x.status==='Serving').length,done=a.filter(x=>['Done','Completed'].includes(x.status)).length;return `<section class="hc-rhu-card"><h3><i class="fas fa-hospital" style="color:#1e40af;margin-right:8px"></i>${b}</h3><div class="hc-rhu-metrics"><div class="hc-rhu-metric"><span>Appointments</span><strong>${a.length}</strong></div><div class="hc-rhu-metric"><span>Waiting</span><strong>${waiting}</strong></div><div class="hc-rhu-metric"><span>Serving / Done</span><strong>${serving} / ${done}</strong></div></div></section>`}).join('')}catch(e){document.getElementById('rhuCards').innerHTML='<div class="hc-rhu-card">Unable to load RHU data: '+e.message+'</div>'}})();
</script><script src="admin-shell.js?v=20260727-auto-confirm-v2"></script>
