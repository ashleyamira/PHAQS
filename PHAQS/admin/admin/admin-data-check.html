<meta http-equiv="Expires" content="0"><meta charset="utf-8"><title>Admin Data Connection Check</title><link rel="icon" href="images/mhc-logo.png"><style>body{font-family:Arial;background:#f4f7fb;padding:24px;color:#10213f}main{max-width:1000px;margin:auto;background:#fff;border:1px solid #dbe4ef;border-radius:12px;padding:22px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border-bottom:1px solid #e5e7eb;padding:9px;text-align:left;font-size:13px}.ok{color:#15803d}.bad{color:#dc2626}pre{background:#f8fafc;padding:12px;overflow:auto}</style><script src="../assets/js/csrf.js"></script>
<style id="hcLogoutConfirmationStyles">
.hc-logout-backdrop{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.48);backdrop-filter:blur(2px)}
.hc-logout-backdrop.show{display:flex}.hc-logout-dialog{width:min(430px,100%);overflow:hidden;border:1px solid #dbe3ef;border-radius:14px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.28);font-family:Inter,Arial,sans-serif}
.hc-logout-dialog-head{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}.hc-logout-dialog-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#fee2e2;color:#dc2626;font-size:17px}.hc-logout-dialog-head h3{margin:0;color:#0f172a;font-size:18px;font-weight:750}.hc-logout-dialog-body{padding:0 22px 20px;color:#64748b;font-size:14px;line-height:1.55}.hc-logout-dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid #e7edf5;background:#f8fafc}.hc-logout-dialog-actions button{min-width:94px;height:40px;border-radius:8px;font:700 13px Inter,Arial,sans-serif;cursor:pointer}.hc-logout-cancel{border:1px solid #cbd5e1;background:#fff;color:#334155}.hc-logout-confirm{border:1px solid #dc2626;background:#dc2626;color:#fff}.hc-logout-confirm:disabled{opacity:.65;cursor:wait}
</style>
</head><body><main><h1>Admin Data Connection Check</h1><p>This page reads the same unified endpoint used by Dashboard and Reports.</p><div id="summary"></div><table><thead><tr><th>RHU</th><th>Today Total</th><th>Serving</th><th>Waiting</th><th>Served</th></tr></thead><tbody id="rows"></tbody></table><pre id="raw"></pre></main><script src="../backend/backend.js"></script><script>(async()=>{try{const s=await hcApi('admin_dashboard_snapshot');document.getElementById('summary').innerHTML=`<p class="ok"><b>Connected.</b> Data date: ${s.dataDate}</p><p>Appointments today: ${s.metrics.todayAppointments} | In queue: ${s.metrics.inQueue} | Now serving: ${s.metrics.nowServing} | Served today: ${s.metrics.servedToday}</p>`;document.getElementById('rows').innerHTML=Object.entries(s.queueData||{}).map(([n,b])=>`<tr><td>${n}</td><td>${b.totalToday||0}</td><td>${b.serving||0}</td><td>${b.waiting||0}</td><td>${b.served||0}</td></tr>`).join('');document.getElementById('raw').textContent=JSON.stringify(s.metrics,null,2)}catch(e){document.getElementById('summary').innerHTML=`<p class="bad"><b>Not connected:</b> ${e.message}</p>`}})();</script><script src="admin-shell.js?v=20260727-auto-confirm-v2"></script>
