<meta http-equiv="Expires" content="0"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening Patient Inquiries</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#10213f;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #dbe4ef;padding:24px 30px;border-radius:8px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.08)}.spin{width:26px;height:26px;border:3px solid #dbeafe;border-top-color:#0b3d91;border-radius:50%;margin:0 auto 12px;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
<style id="hcLogoutConfirmationStyles">
.hc-logout-backdrop{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.48);backdrop-filter:blur(2px)}
.hc-logout-backdrop.show{display:flex}.hc-logout-dialog{width:min(430px,100%);overflow:hidden;border:1px solid #dbe3ef;border-radius:14px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.28);font-family:Inter,Arial,sans-serif}
.hc-logout-dialog-head{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}.hc-logout-dialog-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#fee2e2;color:#dc2626;font-size:17px}.hc-logout-dialog-head h3{margin:0;color:#0f172a;font-size:18px;font-weight:750}.hc-logout-dialog-body{padding:0 22px 20px;color:#64748b;font-size:14px;line-height:1.55}.hc-logout-dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid #e7edf5;background:#f8fafc}.hc-logout-dialog-actions button{min-width:94px;height:40px;border-radius:8px;font:700 13px Inter,Arial,sans-serif;cursor:pointer}.hc-logout-cancel{border:1px solid #cbd5e1;background:#fff;color:#334155}.hc-logout-confirm{border:1px solid #dc2626;background:#dc2626;color:#fff}.hc-logout-confirm:disabled{opacity:.65;cursor:wait}
</style>
</head><body><div class="box"><div class="spin"></div><strong>Opening Patient Inquiries…</strong></div><script>(async()=>{const box=document.querySelector('.box');try{const response=await fetch('../backend/api.php?action=admin_me',{credentials:'include',cache:'no-store',headers:{Accept:'application/json'}});const raw=await response.text();let result;try{result=JSON.parse(raw)}catch(_){throw Object.assign(new Error('The session service returned an invalid response.'),{status:response.status})}if(!response.ok||!result.ok){throw Object.assign(new Error(result.message||'Unable to verify your session.'),{status:response.status})}const a=result.admin||{},role=String(a.role||'').trim().toLowerCase(),branch=String(a.branch||'').trim().toLowerCase();const full=['system administrator','super administrator','super admin'].includes(role)||['all branches','all rhu branches','all branch','all rhu'].includes(branch);location.replace(full?'admin-messages.html':'staff-messages.html')}catch(error){if(Number(error.status)===401){location.replace('admin-login.html?reason=session-expired');return}box.innerHTML='<strong>Unable to open Patient Inquiries</strong><p style="max-width:420px;color:#64748b;font-size:13px">'+String(error.message||'Server error').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</p><a href="admin-dashboard.html" style="color:#0b3d91;font-weight:700">Return to dashboard</a>'}})();</script>
