<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:40px;color:#10213f}
.card{max-width:560px;margin:auto;background:#fff;border:1px solid #dbe4ef;border-radius:12px;padding:24px}
h1{font-size:22px;margin:0 0 8px}p{color:#667085;font-size:14px}
label{display:block;margin:16px 0 6px;font-weight:700;font-size:13px}
input,textarea{width:100%;box-sizing:border-box;border:1px solid #cfd8e5;border-radius:8px;padding:11px;font:inherit}

<style id="hcLogoutConfirmationStyles">
.hc-logout-backdrop{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.48);backdrop-filter:blur(2px)}
.hc-logout-backdrop.show{display:flex}.hc-logout-dialog{width:min(430px,100%);overflow:hidden;border:1px solid #dbe3ef;border-radius:14px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.28);font-family:Inter,Arial,sans-serif}
.hc-logout-dialog-head{display:flex;align-items:center;gap:12px;padding:20px 22px 14px}.hc-logout-dialog-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#fee2e2;color:#dc2626;font-size:17px}.hc-logout-dialog-head h3{margin:0;color:#0f172a;font-size:18px;font-weight:750}.hc-logout-dialog-body{padding:0 22px 20px;color:#64748b;font-size:14px;line-height:1.55}.hc-logout-dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid #e7edf5;background:#f8fafc}.hc-logout-dialog-actions button{min-width:94px;height:40px;border-radius:8px;font:700 13px Inter,Arial,sans-serif;cursor:pointer}.hc-logout-cancel{border:1px solid #cbd5e1;background:#fff;color:#334155}.hc-logout-confirm{border:1px solid #dc2626;background:#dc2626;color:#fff}.hc-logout-confirm:disabled{opacity:.65;cursor:wait}
</style>
</head>
<body>
<div class="card">
  <h1>Brevo SMS Test</h1>
  <p>System Administrator login is required. Use a Philippine mobile number.</p>
  <label for="phone">Mobile number</label>
  <input id="phone" placeholder="09XXXXXXXXX">
  <label for="message">Message</label>
  <textarea id="message">Pulilan Health Center SMS integration test.</textarea>
  <button id="sendBtn">Send Test SMS</button>
  <div id="result"></div>
</div>
<script>
document.getElementById('sendBtn').addEventListener('click', async () => {
  const resultBox = document.getElementById('result');
  resultBox.className = '';
  resultBox.style.display = 'block';
  resultBox.textContent = 'Sending...';

  try {
    const response = await fetch('../backend/api.php?action=admin_test_brevo_sms', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        phone:document.getElementById('phone').value,
        message:document.getElementById('message').value
      })
    });
    const result = await response.json();
    resultBox.className = result.ok ? 'success' : 'error';
    resultBox.textContent = result.message + (result.sms?.httpCode ? '\\nHTTP: ' + result.sms.httpCode : '');
  } catch (error) {
    resultBox.className = 'error';
    resultBox.textContent = 'Request failed: ' + error.message;
  }
});
</script>
